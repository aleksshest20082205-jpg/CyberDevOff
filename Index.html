<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CyberDev Studio — Главная</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    :root{
      --bg1: #0a0f1c;
      --bg2: #1e1b33;
      --neon1: #00f6ff;
      --neon2: #ff4aff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at 10% 10%, var(--bg2), var(--bg1));
      color: #f0f0f0;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    /* Header */
    header#site-header{
      position:fixed;
      left:0; top:0; right:0;
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 28px;
      gap:16px;
      z-index:1100;
      transition:backdrop-filter .35s, background .35s, height .25s, box-shadow .25s;
      background:transparent;
    }

    header#site-header.compact{
      background: rgba(6,6,10,0.6);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      height:64px;
    }

    .header-left{
      display:flex;align-items:center;gap:10px;min-width:180px;
      transform:translateY(-6px);
      opacity:0;
      transition:all .35s cubic-bezier(.2,.9,.2,1);
    }
    header#site-header.compact .header-left{ transform:translateY(0); opacity:1; }

    .header-left img{ width:40px;height:40px;border-radius:8px; object-fit:cover; box-shadow:0 6px 18px rgba(0,0,0,.6); }
    .brand-title{ font-weight:700; font-size:18px; color:var(--neon2); text-shadow:0 0 8px rgba(255,74,255,0.18);}

    /* center nav */
    nav{ display:flex; gap:18px; align-items:center; justify-content:center; flex:1; }
    nav a{ color:rgba(255,255,255,.9); text-decoration:none; font-weight:600; padding:6px 8px; border-radius:8px; transition:color .2s, background .2s; }
    nav a:hover{ color:var(--neon1); background: rgba(255,255,255,0.02); }

    /* Hero */
    main { padding-top: calc(72px + 24px); } /* <-- отступ чтобы шапка не перекрывала контент */
    .hero{
      height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;
    }
    .hero .logo{
      width:160px;height:160px;border-radius:16px;overflow:hidden;margin-bottom:18px;transition:transform .45s, opacity .45s; box-shadow:0 30px 80px rgba(0,0,0,0.6);
    }
    .hero .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .hero h1{ font-size:64px; margin:0; line-height:1; font-weight:800; background:linear-gradient(90deg,var(--neon2),var(--neon1)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 18px rgba(0,255,255,0.06); transition:transform .45s, opacity .45s;}
    .hero p{ max-width:860px; color:rgba(255,255,255,0.85); margin-top:12px; font-size:18px; opacity:.95; transition:opacity .35s; }

    /* Apps list */
    .apps{ padding:80px 20px; max-width:1200px;margin:0 auto 80px; }
    .apps h2{ text-align:center; font-size:34px; margin:8px 0 28px; color:var(--neon2); }
    .app-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:28px; }

    /* Делать карточку ссылкой: */
    .app-link { display:block; text-decoration:none; color:inherit; }
    .app-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:16px; padding:20px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.6);
      transition:transform .28s ease, box-shadow .28s ease, opacity .6s, transform .6s;
      cursor:pointer; opacity:0; transform:translateY(36px);
      user-select:none;
    }
    .app-card.show{ opacity:1; transform:translateY(0); }
    .app-card:hover{ transform:translateY(-8px); box-shadow:0 26px 60px rgba(0,0,0,0.7); }
    .app-card img{ width:110px;height:110px;border-radius:14px; object-fit:cover; margin-bottom:12px; }
    .app-card h3{ margin:8px 0; color:var(--neon1); }
    .app-card p{ margin:6px 0 14px; color:rgba(255,255,255,0.85); }

    /* Footer */
    footer{ padding:36px 20px; text-align:center; color:rgba(255,255,255,0.6); background:transparent; }

    /* small screens */
    @media (max-width:720px){
      .hero h1{ font-size:38px; }
      .hero .logo{ width:100px;height:100px; }
      .header-left img{ width:32px;height:32px; }
      nav{ display:none; } /* simplify for mobile */
    }
  </style>
</head>
<body>
  <header id="site-header" aria-hidden="false">
    <div class="header-left" id="headerBrand" aria-hidden="true">
      <img id="headerBrandLogo" src="image.jpg" alt="Лого компании">
      <div class="brand-title" id="headerBrandName">CyberDev</div>
    </div>

    <nav aria-label="Главное меню">
      <a href="#apps"
